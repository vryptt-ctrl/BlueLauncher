Builds:
  - versionName: 1.1.1
    versionCode: 3
    commit: v1.1.1
    sudo:
      - apt-get update
      - apt-get install -y --no-install-recommends gcc libc-dev
    output: app/build/outputs/apk/release/app-release-unsigned.apk
    prebuild:
      - curl -fsSL --proto '=https' --tlsv1.2 -o $HOME/rustup-init https://static.rust-lang.org/rustup/archive/1.29.3/x86_64-unknown-linux-gnu/rustup-init
      - echo "b1c8cb14e30889e7e2999e6b69e62d9e9b9ffc0f4df8180564d306d9680e6c55  $HOME/rustup-init" | sha256sum --check --strict
      - chmod +x $HOME/rustup-init
      - $HOME/rustup-init -y --no-modify-path --profile minimal --default-toolchain 1.100.0
      - $HOME/.cargo/bin/rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
    build:
      - export PATH="$HOME/.cargo/bin:$PATH"
      - export ANDROID_NDK_HOME=$$NDK$$
      - gradle assembleRelease
    ndk: 27.2.12479018

MaintainerNotes: |-
  Raw "build:" is used instead of "gradle:" because fdroidserver removes
  gradlew/gradlew.bat and the Rust toolchain must be on PATH for the Gradle
  build. "gradle" on the build server is gradlew-fdroid, which reads
  gradle/wrapper/gradle-wrapper.properties (Gradle 9.6.0).

  sudo installs gcc and libc-dev so cargo host build scripts have the host linker cc.

  prebuild installs Rust 1.100.0 through rustup from a checksum-pinned
  rustup-init; the NDK is provided by "ndk:" and used for the Cargo linkers.

  No Binaries: entry: the GitHub release APK is not bit-for-bit reproducible
  across build hosts (Rust/AGP toolchains), so F-Droid signs its own build.
  Users switching from the GitHub APK must uninstall it first.

  fastlane/metadata/android/en-US/ landed after v1.1.1 was tagged, so F-Droid
  cannot read it for this build and only the Description and localized summary
  are shown. The next tagged release will pick up the icon, feature graphic, TV
  screenshots and changelog from the repo.

