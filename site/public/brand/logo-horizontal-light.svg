<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 100" width="1080" height="200">
  <title>BlueLauncher logo, horizontal, for light backgrounds</title>
  <defs>
    <linearGradient id="hi" x1="53" y1="21" x2="79" y2="47" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5AA9FF"/>
      <stop offset="1" stop-color="#2F7DFF"/>
    </linearGradient>
  </defs>
  <svg x="0" y="0" width="100" height="100" viewBox="15 11 74 74">
    <rect x="21" y="21" width="26" height="26" rx="7" fill="#25406E"/>
    <rect x="21" y="53" width="26" height="26" rx="7" fill="#25406E"/>
    <rect x="53" y="53" width="26" height="26" rx="7" fill="#25406E"/>
    <rect x="53" y="21" width="26" height="26" rx="7" fill="url(#hi)"/>
    <rect x="50" y="18" width="32" height="32" rx="9.5" fill="none" stroke="#2F7DFF" stroke-width="2.5"/>
  </svg>
  <text x="124" y="67" font-family="Inter, Helvetica, Arial, sans-serif" font-size="58" fill="#0B1220" font-weight="700" letter-spacing="-1">Blue<tspan font-weight="400" fill="#1D63E0">Launcher</tspan></text>
</svg>
